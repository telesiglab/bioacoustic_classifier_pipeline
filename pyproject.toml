[project]
name = "perch-hoplite-notebooks"
version = "0.1.0"
description = "Entorno reproducible para el pipeline de clasificación bioacústica con Perch-Hoplite."
requires-python = "==3.10.*"
dependencies = [
    "etils[epath]>=1.9,<2",
    "ipykernel<7",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.9,<4",
    "ml-collections>=0.1.1,<0.2",
    "numpy==2.0.2",
    "pandas>=2.2,<3",
    "perch-hoplite[tf]==1.0.2",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "tensorflow==2.20.0",
    "tqdm>=4.66,<5",
    "usearch==2.25.2",
]

[tool.uv]
package = false
